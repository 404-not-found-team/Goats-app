<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goats - Ranglista</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="Styles/style.css">
    <link rel="stylesheet" href="Styles/style-ranglista.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <ul>
        <li><a href="index.html">
                <span class="teljes-szoveg">Kezdőlap</span>
                <span class="rovid-szoveg">🏠</span>
            </a></li>
        <li><a href="tartozasok.html">
                <span class="teljes-szoveg">Tartozások</span>
                <span class="rovid-szoveg">💸</span>
            </a></li>
        <li><a href="tervek.html">
                <span class="teljes-szoveg">Tervek</span>
                <span class="rovid-szoveg">📋</span>
            </a></li>
        <li class="active"><a href="ranglista.html">
                <span class="teljes-szoveg">Ranglista</span>
                <span class="rovid-szoveg">🏅</span>
            </a></li>
    </ul>

    <div class="ranglista-fo-tarolo">
        <div class="kategoria-kontener">
            <h3 class="cimke legeslegjobb dark">S</h3>
            <div class="ranglista-dropzone" data-kategoria="legeslegjobb"></div>
        </div>
        <div class="kategoria-kontener">
            <h3 class="cimke legjobb dark">A</h3>
            <div class="ranglista-dropzone" data-kategoria="legjobb"></div>
        </div>

        <div class="kategoria-kontener">
            <h3 class="cimke elmegy dark">B</h3>
            <div class="ranglista-dropzone" data-kategoria="elmegy"></div>
        </div>

        <div class="kategoria-kontener">
            <h3 class="cimke soha dark">C</h3>
            <div class="ranglista-dropzone" data-kategoria="soha"></div>
        </div>
        <div class="kategoria-kontener">
            <h3 class="cimke megjobbansoha dark">D</h3>
            <div class="ranglista-dropzone" data-kategoria="megjobbansoha"></div>
        </div>

        <div class="forras-doboz">
            <div class="forras-fejlec">
                <h3>Vodkák</h3>
                <span class="ital-szamlalo" id="szamlalo-vodka">0 / 0</span>
            </div>
            <div class="ital-lista" id="vodkaLista">
            </div>
        </div>
        <div class="forras-doboz">
            <div class="forras-fejlec">
                <h3>Whiskeyk</h3>
                <span class="ital-szamlalo" id="szamlalo-whiskey">0 / 0</span>
            </div>
            <div class="ital-lista" id="whiskeyLista">
            </div>
        </div>
        <div class="forras-doboz">
            <div class="forras-fejlec">
                <h3>Likőrök</h3>
                <span class="ital-szamlalo" id="szamlalo-likor">0 / 0</span>
            </div>
            <div class="ital-lista" id="likorLista">
            </div>
        </div>
        <div class="forras-doboz">
            <div class="forras-fejlec">
                <h3>Bitterek</h3>
                <span class="ital-szamlalo" id="szamlalo-bitter">0 / 0</span>
            </div>
            <div class="ital-lista" id="bitterLista">
            </div>
        </div>
        <div class="forras-doboz">
            <div class="forras-fejlec">
                <h3>Ciderek</h3>
                <span class="ital-szamlalo" id="szamlalo-cider">0 / 0</span>
            </div>
            <div class="ital-lista" id="ciderLista">
            </div>
        </div>
        <div class="forras-doboz">
            <div class="forras-fejlec">
                <h3>Sörök</h3>
                <span class="ital-szamlalo" id="szamlalo-sor">0 / 0</span>
            </div>
            <div class="ital-lista" id="sorLista"></div>
        </div>
        <div class="forras-doboz">
            <div class="forras-fejlec">
                <h3>Borok</h3>
                <span class="ital-szamlalo" id="szamlalo-bor">0 / 0</span>
            </div>
            <div class="ital-lista" id="borLista"></div>
        </div>
        <div class="forras-doboz">
            <div class="forras-fejlec">
                <h3>Fröccs</h3>
                <span class="ital-szamlalo" id="szamlalo-froccs">0 / 0</span>
            </div>
            <div class="ital-lista" id="froccsLista"></div>
        </div>
        <div class="forras-doboz">
            <div class="forras-fejlec">
                <h3>Egyéb</h3>
                <span class="ital-szamlalo" id="szamlalo-egyeb">0 / 0</span>
            </div>
            <div class="ital-lista" id="italLista"></div>
        </div>
    </div>
    <div id="modal-hatter">
        <div id="hatter">
            <img id="modal-kep" src="" alt="Kiválasztott ital">
            <div id="modal-nev" style="color: white; font-size: 20px; margin-bottom: 15px; font-weight: bold;">
            </div>

            <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center;">
                <button id="legeslegjobb" class="gombok dark" onclick="kategoriatValaszt('legeslegjobb')">S</button>
                <button id="legjobb" class="gombok dark" onclick="kategoriatValaszt('legjobb')">A</button>
                <button id="elmegy" class="gombok dark" onclick="kategoriatValaszt('elmegy')">B</button>
                <button id="soha" class="gombok dark" onclick="kategoriatValaszt('soha')">C</button>
                <button id="megjobbansoha" class="gombok dark" onclick="kategoriatValaszt('megjobbansoha')">D</button>
                <button id="forras" class="gombok" onclick="kategoriatValaszt('forras')">↩️ Vissza</button>
                <button id="bezar" class="gombok" onclick="modalBezár()">Mégse</button>
            </div>
        </div>
    </div>
</body>

<script src="JS files/supabase-client.js"></script>
<script src="JS files/ranglista-mozgatas.js"></script>

</html>
