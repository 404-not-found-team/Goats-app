<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goats - Ranglista</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/ranglista.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/main.js"></script>
    <script src="js/pages/ranglista.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script>
        (function () {
            emailjs.init("2wdZeM2a3phUPdOaT");
        })();
    </script>
</head>

<body>
    <ul id="navBar"></ul>

    <div class="fejlec-gombok-tarolo">
        <button id="szuro-gomb" onclick="nyisdSzuroModal()" class="gomb-szuro">🔍 Szűrők</button>
        <button id="uj-ital-gomb" onclick="nyisdUjItalModal()" class="gomb-uj-ital">➕ Új ital hozzáadása</button>
    </div>

    <div class="ranglista-fo-tarolo">
        <div id="kategoriak-kontener"></div>
        <div id="forras-dobozok-kontener"></div>
    </div>

    <div id="modal-hatter">
        <div id="hatter" class="modal-kis-doboz">
            <img id="modal-kep" src="" alt="Kiválasztott ital">
            <div id="modal-nev" class="modal-ital-cim"></div>
            <div id="modal-alkohol-badge" class="alkohol-badge" style="display: none;"></div>
            
            <div id="modal-koktel-hozzavalok-doboz" class="modal-hozzavalok-box">
                <div class="modal-hozzavalok-fejlec">🍹 Hozzávalók és Arányok:</div>
                <div id="modal-koktel-hozzavalok-lista" class="modal-hozzavalok-lista"></div>
            </div>

            <div class="modal-gomb-csoport">
                <button id="legeslegjobb" class="gombok dark" onclick="kategoriatValaszt('S')">S</button>
                <button id="legjobb" class="gombok dark" onclick="kategoriatValaszt('A')">A</button>
                <button id="elmegy" class="gombok dark" onclick="kategoriatValaszt('B')">B</button>
                <button id="soha" class="gombok dark" onclick="kategoriatValaszt('C')">C</button>
                <button id="megjobbansoha" class="gombok dark" onclick="kategoriatValaszt('D')">D</button>
                <button id="forras" class="gombok" onclick="kategoriatValaszt('forras')">↩️ Vissza</button>
                <button id="bezar" class="gombok" onclick="modalBezár()">Mégse</button>
            </div>
        </div>
    </div>

    <div id="uj-ital-modal" class="modal-hatter-ui">
        <div class="modal-doboz-ui modal-nagy-doboz">
            <h3 class="modal-alcim">Új ital / koktél felvétele</h3>

            <div class="floating-group">
                <input type="text" id="uj-ital-nev" class="floating-input" placeholder=" " />
                <label class="floating-label">Ital neve</label>
            </div>

            <div class="floating-group">
                <select id="uj-ital-kategoria" class="floating-select" onchange="kategoriaValtozasCheck()">
                    <option value="vodka">Vodka</option>
                    <option value="rum">Rum</option>
                    <option value="whiskey">Whiskey</option>
                    <option value="likor">Likőr</option>
                    <option value="bitter">Bitter</option>
                    <option value="cider">Cider</option>
                    <option value="sor">Sör</option>
                    <option value="bor">Bor</option>
                    <option value="froccs">Fröccs</option>
                    <option value="energiaital">Energiaital</option>
                    <option value="koktel">Koktél</option>
                    <option value="egyeb">Egyéb</option>
                </select>
                <label class="floating-label">Ital Fajta</label>
            </div>

            <div id="alkoholfok-group" class="floating-group">
                <input type="number" id="uj-ital-szazalek" class="floating-input" placeholder=" " step="0.1" />
                <label class="floating-label">Alkoholfok (%)</label>
            </div>

            <div id="koktel-összeallitas-resz" class="koktel-resz-kontener">
                <div class="toggle-mode-container">
                    <button type="button" id="mode-arany-btn" class="toggle-mode-btn active" onclick="valtsMódot('arany')">📐 Arányok alapján</button>
                    <button type="button" id="mode-pontos-btn" class="toggle-mode-btn" onclick="valtsMódot('pontos')">🧪 Pontos mennyiség</button>
                </div>

                <h4 class="hozzavalo-alcim">☰ Hozzávalók</h4>

                <div id="hozzavalok-lista"></div>

                <button type="button" class="gomb-uj-hozzavalo" onclick="ujHozzavaloSor()">+ Új hozzávaló</button>
            </div>

            <div class="modal-akcio-gombok">
                <button onclick="mentUjItal()" class="sm-btn gomb-hozzaadas">Hozzáadás</button>
                <button onclick="zardUjItalModal()" class="sm-btn gomb-megse">Mégse</button>
            </div>
        </div>
    </div>

    <div id="szuro-modal" class="modal-hatter-ui">
        <div class="modal-doboz-ui szuro-modal-doboz">
            <h3 class="szuro-modal-cim">🔍 Ranglista Szűrők</h3>

            <label class="sm-label szuro-label">📂 Kategóriák megjelenítése:</label>
            <div id="kategoria-szuro-list" class="szuro-pill-kontener"></div>

            <label class="sm-label szuro-label szuro-label-top">🚫 Márka / Név kizárása (Enterrel add hozzá):</label>
            <div class="szuro-input-sor">
                <input type="text" id="kizart-kulcsszo-input" class="sm-input szuro-input" placeholder="Pl. Royal, Finlandia..." onkeydown="kezeldTagEnter(event)">
                <button type="button" onclick="hozzaadKizartTag()" class="sm-btn gomb-plusz">+</button>
            </div>

            <div id="kizart-tagek-kontener" class="tag-kontener"></div>

            <div class="szuro-footer">
                <button onclick="zardSzuroModal()" class="sm-btn gomb-kesz">Kész</button>
            </div>
        </div>
    </div>
</body>

</html>
