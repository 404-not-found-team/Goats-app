<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="style-src 'self' https://cdnjs.cloudflare.com; style-src-attr 'none';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goats</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">

    <link rel="preconnect" href="https://bvositlxbeqztnhdembx.supabase.co" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="modulepreload" href="js/main.js">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>

    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/pages/app-orzo.js"></script>

    <script src="js/segedek/csoport-kod.js"></script>
    <script defer src="js/elemek/galeria.js"></script>
    <script defer src="js/elemek/naptar.js"></script>
</head>

<body>
    <ul id="navBar"></ul>

    <div class="hatter">

        <div class="kepek">
            <input type="file" id="kepFeltoltesInput" accept="image/*" multiple hidden>
            <a href="#" id="kepFeltoltesGomb" onclick="nyisdMegFajlValasztot(); return false;" title="Kép feltöltése">
                <i class="fa-solid fa-upload"></i>
            </a>
            <i class="fa-solid fa-caret-left nyil" onclick="eloKep()"></i>

            <img id="kepBal" class="galeria-kep hatrebb" alt="Előző kép" width="120" height="120" loading="lazy" decoding="async">
            <img id="kepKozep" class="galeria-kep" alt="Aktuális kép" width="180" height="180" loading="lazy" decoding="async">
            <img id="kepJobb" class="galeria-kep hatrebb" alt="Következő kép" width="120" height="120" loading="lazy" decoding="async">

            <i class="fa-solid fa-caret-right nyil" onclick="kovKep()"></i>

            <div id="galeria-placeholder" class="galeria-ures" hidden></div>

            <!-- Feltöltés állapota: előnézet + szöveg (FELADAT12) -->
            <div id="kepFeltoltesAllapot" class="galeria-feltoltes-allapot" role="status" aria-live="polite" hidden>
                <img id="kepFeltoltesElonezet" class="galeria-elonezet" alt="A feltöltendő kép előnézete" width="32" height="32" hidden>
                <span id="kepFeltoltesSzoveg"></span>
            </div>

            <!-- Műveleti sáv a középső kép alatt: feltöltő neve (FELADAT9) és ⋮ menü.
                 Nagyított nézet nincs (FELADAT12), a kép műveletei mind ide kerülnek. -->
            <div id="kepMuveletSav" class="galeria-muvelet-sav" hidden>
                <span id="kepFeltoltoFelirat" class="galeria-feltolto-felirat" hidden></span>
                <div class="galeria-menu">
                    <button type="button" id="kepMenuGomb" class="galeria-menu-gomb" title="Műveletek" aria-label="Kép műveletei" aria-haspopup="menu" aria-expanded="false" aria-controls="kepMenu">
                        <i class="fa-solid fa-ellipsis-vertical"></i>
                    </button>
                    <div id="kepMenu" class="galeria-menu-lista" role="menu" hidden>
                        <!-- FELADAT5: a "Jelentés" menüpont helye (még nincs funkciója, ezért rejtett) -->
                        <button type="button" class="galeria-menupont" data-muvelet="jelentes" role="menuitem" hidden>Jelentés</button>
                        <button type="button" id="kepTorlesMenupont" class="galeria-menupont veszelyes" data-muvelet="torles" role="menuitem">Törlés</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="naptar-kontener">
            <div class="naptar-fejlec">
                <button id="elozo-honap-btn">&lt;</button>
                <h2 id="naptar-honap-nev">2026 Szeptember</h2>
                <button id="kovetkezo-honap-btn">&gt;</button>
            </div>

            <div class="naptar-napok-fejlec">
                <span>H</span><span>K</span><span>Sze</span><span>Cs</span><span>P</span><span>Szo</span><span>V</span>
            </div>

            <div id="naptar-rács" class="naptar-racs"></div>

            <button id="uj-esemeny-gomb" class="sm-btn sm-btn-save mt-15">+ Új esemény</button>
        </div>

        <!-- Új Esemény Modal -->
        <div id="esemeny-modal" class="sm-overlay" hidden>
            <div class="sm-card">
                <div class="sm-header">
                    <h3>Esemény hozzáadása</h3>
                    <button id="close-esemeny-modal" class="sm-close-btn">&times;</button>
                </div>
                <div class="floating-group">
                    <input type="text" id="esemeny-cim-input" class="floating-input" placeholder=" " />
                    <label class="floating-label">Esemény neve:</label>
                </div>
                <div class="floating-group">
                    <input type="date" id="esemeny-datum-input" class="floating-input" placeholder=" " />
                    <label class="floating-label">Dátum:</label>
                </div>

                <button id="ment-esemeny-btn" class="sm-btn sm-btn-save">Mentés</button>
            </div>
        </div>

        <div id="napi-esemenyek-modal" class="sm-overlay" hidden>
            <div class="sm-card modal-magas">
                <div class="sm-header">
                    <h3 id="napi-modal-cím">Események</h3>
                    <button id="close-napi-esemenyek-modal" class="sm-close-btn">&times;</button>
                </div>
                <div id="napi-esemenyek-lista" class="napi-lista">
                </div>
                <button id="napi-uj-esemeny-btn" class="sm-btn sm-btn-save">Új esemény ezen a napon</button>
            </div>
        </div>

        <!-- 2. Esemény Részletek / Módosítás / Törlés Modal -->
        <div id="esemeny-reszletek-modal" class="sm-overlay" hidden>
            <div class="sm-card">
                <div class="sm-header">
                    <h3>Esemény szerkesztése</h3>
                    <button id="close-esemeny-reszletek-modal" class="sm-close-btn">&times;</button>
                </div>
                <div class="floating-group">
                    <input type="text" id="szerkeszt-esemeny-cim" class="floating-input" placeholder=" " />
                    <label class="floating-label">Esemény neve:</label>
                </div>
                <div class="floating-group">
                    <input type="date" id="szerkeszt-esemeny-datum" class="floating-input" placeholder=" " />
                    <label class="floating-label">Dátum:</label>
                </div>

                <div class="gomb-sor">
                    <button id="modosit-esemeny-btn" class="sm-btn sm-btn-save nyujt">Módosítás</button>
                    <button id="torol-esemeny-btn" class="sm-btn sm-btn-logout nyujt mt-0">Törlés</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker sikeresen betöltve!', reg))
                    .catch(err => console.error('Service Worker hiba:', err));
            });
        }
    </script>
</body>

</html>
