    <!-- Rejtett fájlbeviteli mező a kép feltöltéshez. Mobilon kamera/galéria választót nyit, gépen fájlböngészőt. -->
    <input type="file" id="kepFeltoltesInput" accept="image/*" multiple style="display: none;">

    <div class="hatter">

            <iframe width="600" height="600" src="https://www.youtube.com/embed/qGmIoFmBnKs?autoplay=1&mute=1&rel=0"

            <i class="fa-solid fa-caret-right nyil" style="color: rgb(255, 255, 255);" onclick="kovKep()"></i>
