<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goats - Tartozások</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/tartozasok.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/main.js"></script>
    <script src="js/pages/tartozasok.js"></script>
</head>

<body>
    <ul id="navBar"></ul>

    <div class="container-tartozasok">
        <h1>Tartozások</h1>

        <div class="input-tartozasok">
            <input type="text" id="miertInput" placeholder="Miért">
            <input type="text" id="mennyiertInput" placeholder="Mennyiért">

            <div class="custom-dropdown" id="kinekDropdown">
                <div class="dropdown-btn" onclick="toggleKinekDropdown()">
                    <span id="kinekDropdownLabel">Kinek tartozik?</span>
                </div>
                <div class="dropdown-content" id="kinekDropdownContent">
                </div>
            </div>

            <div class="custom-dropdown" id="kiTartozikDropdown">
                <div class="dropdown-btn" onclick="toggleDropdown()">
                    <span id="dropdownBtnLabel">Ki tartozik?</span>
                </div>
                <div class="dropdown-content" id="dropdownContent">
                </div>
            </div>

            <input type="button" value="Hozzáad" onclick="addTartozas()">
        </div>

        <div class="tartozasok-kontener tartozasok-grid"></div>
    </div>
</body>

</html>
