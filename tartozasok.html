<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goats - Tartozások</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="Styles/style.css">
    <link rel="stylesheet" href="Styles/style-tartozasok.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <ul>
        <li><a href="index.html">
                <span class="teljes-szoveg">Kezdőlap</span>
                <span class="rovid-szoveg">🏠</span>
            </a></li>
        <li class="active"><a href="tartozasok.html">
                <span class="teljes-szoveg">Tartozások</span>
                <span class="rovid-szoveg">💸</span>
            </a></li>
        <li><a href="tervek.html">
                <span class="teljes-szoveg">Tervek</span>
                <span class="rovid-szoveg">📋</span>
            </a></li>
        <li><a href="ranglista.html">
                <span class="teljes-szoveg">Ranglista</span>
                <span class="rovid-szoveg">🏅</span>
            </a></li>
    </ul>

    <div class="container-tartozasok">
        <h1>Tartozások</h1>

        <div class="input-tartozasok">
            <input type="text" id="miertInput" placeholder="Miért">
            <input type="text" id="mennyiertInput" placeholder="Mennyiért">

            <!-- Kinek választó lista -->
            <select id="kinekInput">
                <option value="" disabled selected>Kinek</option>
                <option value="Ákosnak">Ákosnak</option>
                <option value="Ferinek">Ferinek</option>
                <option value="Zalának">Zalának</option>
                <option value="Zolinak">Zolinak</option>
            </select>

            <!-- Ki tartozik választó lista -->
            <select id="kiTartozikInput">
                <option value="" disabled selected>Ki tartozik</option>
                <option value="Ákos">Ákos</option>
                <option value="Feri">Feri</option>
                <option value="Zalán">Zalán</option>
                <option value="Zoli">Zoli</option>
            </select>

            <input type="button" value="Hozzáad" onclick="addTartozas()">
        </div>

        <div class="tartozasok-grid">
            <div class="box">
                <h3>Ákos</h3>
                <div class="akos"></div>
            </div>
            <div class="box">
                <h3>Feri</h3>
                <div class="feri"></div>
            </div>
            <div class="box">
                <h3>Zalán</h3>
                <div class="zalan"></div>
            </div>
            <div class="box">
                <h3>Zoli</h3>
                <div class="zoli"></div>
            </div>
        </div>
    </div>
</body>

<script src="JS files/supabase-client.js"></script>
<script src="JS files/tartozasok.js"></script>

</html>
