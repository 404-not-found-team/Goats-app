<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self'; style-src-attr 'none'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https://bvositlxbeqztnhdembx.supabase.co wss://bvositlxbeqztnhdembx.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title data-i18n="title_debts">ATG - Tartozások</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/pages/tartozasok.css">
    <link rel="stylesheet" href="css/elemek/tartozasok-egyenlitese.css">

    <link rel="preconnect" href="https://bvositlxbeqztnhdembx.supabase.co" crossorigin>
    <link rel="modulepreload" href="js/main.js">
    <script src="js/segedek/nyelv.js"></script>
    <script src="js/kulso/supabase-js-2.117.2.js"></script>

    <script type="module" src="js/main.js"></script>
    <script src="js/segedek/szin-osztaly.js"></script>
    <script src="js/segedek/csoport-kod.js"></script>
    <script src="js/pages/tartozasok.js"></script>
    <script src="js/segedek/html-esemenyek.js" defer></script>
</head>

<body data-oldal="tartozasok">
    <div class="jobb-sav">
    
        <div class="jobb-kontenet">
            <ul id="navBar"></ul>
        </div>
    
    
    <div class="container-tartozasok">
        <h1 data-i18n="debts_title">Tartozások</h1>

        <div class="input-tartozasok">
            <div class="floating-group">
                <input type="text" id="miertInput" class="floating-input" placeholder=" " />
                <label class="floating-label" data-i18n="why">Miért?</label>
            </div>
            <div class="floating-group">
                <input type="number" min="1" id="mennyiertInput" class="floating-input" placeholder=" " />
                <label class="floating-label" data-i18n="how_much">Mennyiért?</label>
            </div>

            <div class="floating-group custom-dropdown" id="kinekDropdown">
                <div class="dropdown-btn" data-katt="toggleKinekDropdown">
                    <span id="kinekDropdownLabel">&nbsp;</span>
                </div>
                <label class="floating-label active" data-i18n="who_owes_whom">Kinek tartozik?</label>
                <div class="dropdown-content" id="kinekDropdownContent"></div>
            </div>

            <div class="floating-group custom-dropdown" id="kiTartozikDropdown">
                <div class="dropdown-btn" data-katt="toggleDropdown">
                    <span id="dropdownBtnLabel">&nbsp;</span>
                </div>
                <label class="floating-label active" data-i18n="who_owes">Ki tartozik?</label>
                <div class="dropdown-content" id="dropdownContent"></div>
            </div>

            <!--<input type="button" id="tartozasHozzaadGomb" value="Hozzáad" data-katt="addTartozas" data-i18n="add_btn">-->
            <button type="button" id="tartozasHozzaadGomb" class="terv-add-btn" data-katt="addTartozas" data-i18n="add_btn">Hozzáad</button>
        </div>

        <div class="kozos-koltseg">
            <div class="kozos-koltseg-infok">
                <fieldset class="elosztas-mod">
                    <legend data-i18n="shared_expense_distribution">Összeg elosztása</legend>
                    <label class="kapcsolo-sor">
                        <input type="radio" name="elosztasMod" value="egyenlo" checked>
                        <span data-i18n="equal_distribution">Egyenlő elosztás</span>
                    </label>
                    <label class="kapcsolo-sor">
                        <input type="radio" name="elosztasMod" value="egyedi">
                        <span data-i18n="custom_amounts">Egyedi összegek</span>
                    </label>
                </fieldset>
                <p id="elosztasElonezet" class="elosztas-elonezet" aria-live="polite"></p>
            </div>
            <div id="egyediOsszegek" class="egyedi-osszegek hidden"></div>
        </div>

        <div class="tartozasok-kontener tartozasok-grid"></div>
    </div>
    </div>
</body>

</html>
