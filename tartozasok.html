<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goats - Tartozások</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/pages/tartozasok.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script type="module" src="js/main.js"></script>
    <script src="js/pages/tartozasok.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function () {
            emailjs.init("2wdZeM2a3phUPdOaT");
        })();
    </script>
</head>

<body>
    <ul id="navBar"></ul>

    <div class="container-tartozasok">
        <h1>Tartozások</h1>

        <div class="input-tartozasok">
            <div class="floating-group">
                <input type="text" id="miertInput" class="floating-input" placeholder=" " />
                <label class="floating-label">Miért?</label>
            </div>
            <div class="floating-group">
                <input type="number" min="1" id="mennyiertInput" class="floating-input" placeholder=" " />
                <label class="floating-label">Mennyiért?</label>
            </div>

            <div class="floating-group custom-dropdown" id="kinekDropdown">
                <div class="dropdown-btn" onclick="toggleKinekDropdown()">
                    <span id="kinekDropdownLabel">&nbsp;</span>
                </div>
                <label class="floating-label active">Kinek tartozik?</label>
                <div class="dropdown-content" id="kinekDropdownContent"></div>
            </div>

            <div class="floating-group custom-dropdown" id="kiTartozikDropdown">
                <div class="dropdown-btn" onclick="toggleDropdown()">
                    <span id="dropdownBtnLabel">&nbsp;</span>
                </div>
                <label class="floating-label active">Ki tartozik?</label>
                <div class="dropdown-content" id="dropdownContent"></div>
            </div>

            <input type="button" value="Hozzáad" onclick="addTartozas()">
        </div>

        <div class="tartozasok-kontener tartozasok-grid"></div>
    </div>
</body>

</html>
