<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self'; style-src-attr 'none'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https://bvositlxbeqztnhdembx.supabase.co wss://bvositlxbeqztnhdembx.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- Bejelentkezés mögötti oldal: ne kerüljön a keresőkbe -->
    <meta name="robots" content="noindex">
    <title data-i18n="title_goats_game">ATG - Tabella</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="192x192" href="img/favicon-192.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/kulso/fontawesome-6.5.1/css/fontawesome.min.css">
    <link rel="stylesheet" href="css/kulso/fontawesome-6.5.1/css/solid.min.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/pages/goatsgame.css">

    <link rel="preconnect" href="https://bvositlxbeqztnhdembx.supabase.co" crossorigin>
    <link rel="modulepreload" href="js/main.js">
    <script src="js/segedek/nyelv.js"></script>
    <script src="js/kulso/supabase-js-2.117.2.js"></script>

    <script type="module" src="js/main.js"></script>
    <script src="js/segedek/szin-osztaly.js"></script>
    <script src="js/pages/goatsgame.js"></script>
    <script src="js/segedek/html-esemenyek.js" defer></script>
</head>

<body data-oldal="goatsgame">
    <div class="jobb-sav">
        <div class="jobb-kontenet">
            <ul id="navBar"></ul>
        </div>
    <div class="fejlec-gombok-tarolo">
        <h1 data-i18n="goats_game_title">Tabella</h1>
    </div>
    <div class="goatsgame-container">
        <div class="tabella">
            <div class="bal-oldal">
                <div class="tablazat nevek" id="nevekOszlop">
                    <div class="fejlec" data-i18n="name">Név</div>
                </div>

                <div class="tablazat-pontok" id="pontJatekOszlopok">
                </div>
            </div>

            <div class="tablazat ossz" id="osszOszlop">
                <div class="fejlec" data-i18n="total_score">Összpont</div>
            </div>
        </div>

        <div class="jatekok" id="jatekokKontener">
            <div class="jatek-fejlec">
                <h2 data-i18n="games">Játékok</h2>
                <button class="gomb-uj-jatek" data-katt="openUjJatekModal" data-i18n="add_new_game">+ Új játék
                    felvétele</button>
            </div>

            <div class="jatek-lista" id="jatekLista">
            </div>
        </div>
    </div>

    <div id="ujJatekModal" class="goatsgame-modal-overlay" hidden>
        <div class="goatsgame-modal-card">
            <div class="goatsgame-modal-header">
                <h3 data-i18n="add_new_game_modal_title">Új játék hozzáadása</h3>
                <button type="button" aria-label="Bezárás" data-i18n-attr="aria-label:close"
                    class="goatsgame-modal-close" data-katt="closeUjJatekModal">&times;</button>
            </div>
            <div class="goatsgame-modal-body">
                <div class="input-group">
                    <label for="ujJatekNevInput" data-i18n="game_name">Játék neve:</label>
                    <input type="text" id="ujJatekNevInput" class="goats-input" maxlength="40"
                        placeholder="Pl.: Csocsó, Darts..." data-i18n-attr="placeholder:game_name_ph" />
                </div>
                <div class="input-group">
                    <label for="ujJatekSzinInput" data-i18n="column_color">Oszlop színe:</label>
                    <input type="color" id="ujJatekSzinInput" class="goats-color-input" value="#4CAF50" />
                </div>
            </div>
            <div class="goatsgame-modal-footer">
                <button class="goatsgame-btn-cancel" data-katt="closeUjJatekModal" data-i18n="back">Mégse</button>
                <button class="goatsgame-btn-save" data-katt="mentUjJatek" data-i18n="add">Hozzáadás</button>
            </div>
        </div>
    </div>
    </div>
</body>

</html>
