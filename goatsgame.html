<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="style-src 'self' https://cdnjs.cloudflare.com; style-src-attr 'none';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goats Game</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/pages/goatsgame.css">

    <link rel="preconnect" href="https://bvositlxbeqztnhdembx.supabase.co" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="modulepreload" href="js/main.js">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>

    <script type="module" src="js/main.js"></script>
    <script src="js/segedek/szin-osztaly.js"></script>
    <script src="js/pages/goatsgame.js"></script>
</head>

<body>
    <ul id="navBar"></ul>
    <div class="goatsgame-container">
        <div class="tabella">
            <div class="bal-oldal">
                <div class="tablazat nevek" id="nevekOszlop">
                    <div class="fejlec">Név</div>
                </div>

                <div class="tablazat-pontok" id="pontJatekOszlopok">
                </div>
            </div>

            <div class="tablazat ossz" id="osszOszlop">
                <div class="fejlec">Összpont</div>
            </div>
        </div>

        <div class="jatekok" id="jatekokKontener">
            <div class="jatek-fejlec">
                <h2>Játékok</h2>
                <button class="gomb-uj-jatek" onclick="openUjJatekModal()">+ Új játék felvétele</button>
            </div>

            <div class="jatek-lista" id="jatekLista">
            </div>
        </div>
    </div>

    <div id="ujJatekModal" class="goatsgame-modal-overlay" hidden>
        <div class="goatsgame-modal-card">
            <div class="goatsgame-modal-header">
                <h3>Új játék hozzáadása</h3>
                <button class="goatsgame-modal-close" onclick="closeUjJatekModal()">&times;</button>
            </div>
            <div class="goatsgame-modal-body">
                <div class="input-group">
                    <label for="ujJatekNevInput">Játék neve:</label>
                    <input type="text" id="ujJatekNevInput" class="goats-input" placeholder="Pl.: Csocsó, Darts..." />
                </div>
                <div class="input-group">
                    <label for="ujJatekSzinInput">Oszlop színe:</label>
                    <input type="color" id="ujJatekSzinInput" class="goats-color-input" value="#4CAF50" />
                </div>
            </div>
            <div class="goatsgame-modal-footer">
                <button class="goatsgame-btn-cancel" onclick="closeUjJatekModal()">Mégse</button>
                <button class="goatsgame-btn-save" onclick="mentUjJatek()">Hozzáadás</button>
            </div>
        </div>
    </div>
</body>

</html>
